# 周六系列审计（承方舆经纬 audit.yml 范式：错峰调度 + 手动触发，每步失败即红，无吞错兜底——教训 20）。
# 与方舆 09:30 错峰 10 分钟，六站巡检一个上午依序跑完；证据口径以 Actions 日志为准。
# 步骤与本仓 ci.yml 同源（确定性子集：lint + 数据断言 + 账目 + 浏览器断言页）。
name: 深度审计
on:
  schedule:
    - cron: "40 1 * * 6"   # 周六 09:40 CST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: lint（确定性检查全量）
        run: python tools/lint.py
      - name: 数据哨兵（分节/航点/覆盖/引书/互文快照）
        run: |
          python - <<'EOF'
          import io, json
          riv = json.load(io.open("data/intermediate/rivers.json", encoding="utf-8"))
          m = riv["meta"]
          assert m["water_sections"] >= 100
          assert m["total_waypoints"] >= 500
          assert 6500 <= m["jing_chars"] <= 8200
          t = io.open("data/river_data.js", encoding="utf-8").read()
          sjz = json.loads(t[t.find("const SJZ = ") + len("const SJZ = "):].rstrip().rstrip(";"))
          assert sjz["meta"]["coverage"] >= 60
          assert sjz["meta"]["crossings"] <= 4
          cites = json.load(io.open("data/intermediate/citations.json", encoding="utf-8"))
          assert len(cites["counts"]) >= 350
          x = io.open("data/crossref.js", encoding="utf-8").read()
          assert '"total":940' in x.replace(" ", "")
          print("哨兵全过")
          EOF
      - name: 经注分离校准（方法 B 硬门）
        run: python tools/calibrate_jing.py --strict
      - name: 起本地服务（离线三验前置）
        run: |
          python -m http.server 9300 --bind 127.0.0.1 &
          # 就绪探针：重试只治冷启动竞态，起不来照样红（非吞错）
          curl -sf --retry 8 --retry-delay 2 --retry-connrefused http://127.0.0.1:9300/index.html -o /dev/null && echo server-up
      - name: 离线三验 offline_check（SW 在位 · 断网重载 · 数据层离线可得）
        env:
          SDJW_BROWSER: /usr/bin/google-chrome
        run: python tools/offline_check.py